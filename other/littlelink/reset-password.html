<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learnpidia - Reset Password</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #101010;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            width: 85%;
            max-width: 420px;
            padding: 35px 25px;
            background: #242424;
            border-radius: 12px;
        }

        h1 {
            color: #F59E0B;
            margin-bottom: 15px;
        }

        p {
            color: #CCCCCC;
            line-height: 1.5;
        }

        input {
            width: 100%;
            height: 50px;
            margin-top: 12px;
            padding: 0 14px;
            box-sizing: border-box;
            background: #101010;
            border: 1px solid #555555;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            height: 50px;
            margin-top: 20px;
            background: #F59E0B;
            border: none;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Learnpidia</h1>

        <p id="message">
            Enter your new password.
        </p>

        <input
            id="newPassword"
            type="password"
            placeholder="New password"
        />

        <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm new password"
        />

        <button id="resetButton">
            Reset password
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>

    <script>
        const client = new Appwrite.Client();

        client
            .setEndpoint("https://fra.cloud.appwrite.io/v1")
            .setProject("6ab8fd4a0019a5d8217b");

        const account =
            new Appwrite.Account(client);

        const params =
            new URLSearchParams(
                window.location.search
            );

        const userId =
            params.get("userId");

        const secret =
            params.get("secret");

        const newPassword =
            document.getElementById(
                "newPassword"
            );

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );

        const resetButton =
            document.getElementById(
                "resetButton"
            );

        const message =
            document.getElementById(
                "message"
            );


        if (!userId || !secret) {

            message.textContent =
                "This password reset link is invalid or incomplete.";

            newPassword.style.display = "none";
            confirmPassword.style.display = "none";
            resetButton.style.display = "none";
        }


        resetButton.addEventListener(
            "click",
            () => {

                const password =
                    newPassword.value;

                const confirmation =
                    confirmPassword.value;


                if (password.length < 8) {

                    message.textContent =
                        "Password must be at least 8 characters.";

                    return;
                }


                if (password !== confirmation) {

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                resetButton.disabled = true;

                message.textContent =
                    "Resetting your password...";


                account
                    .updateRecovery(
                        userId,
                        secret,
                        password
                    )
                    .then(() => {

                        message.textContent =
                            "Your password has been reset successfully.";

                        newPassword.style.display =
                            "none";

                        confirmPassword.style.display =
                            "none";

                        resetButton.style.display =
                            "none";
                    })
                    .catch(error => {

                        resetButton.disabled = false;

                        message.textContent =
                            error.message ||
                            "Unable to reset your password.";
                    });
            }
        );
    </script>

</body>
</html>
