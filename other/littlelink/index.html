<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learnpidia - Email Verification</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #101010;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            width: 85%;
            max-width: 420px;
            padding: 35px 25px;
            background: #242424;
            border-radius: 12px;
        }

        h1 {
            color: #F59E0B;
            margin-bottom: 15px;
        }

        p {
            color: #CCCCCC;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Learnpidia</h1>

        <p id="message">
            Verifying your email...
        </p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>

<script>
    const client = new Appwrite.Client();

    client
        .setEndpoint("https://fra.cloud.appwrite.io/v1")
        .setProject("6ab8fd4a0019a5d8217b");

    const account = new Appwrite.Account(client);

    const params =
        new URLSearchParams(window.location.search);

    const userId =
        params.get("userId");

    const secret =
        params.get("secret");

    const message =
        document.getElementById("message");

    if (!userId || !secret) {

        message.textContent =
            "This verification link is invalid or incomplete.";

    } else {

        message.textContent =
            "Verifying your email...";

        account
            .updateVerification({
                userId: userId,
                secret: secret
            })
            .then(() => {

                message.textContent =
                    "Your email has been verified successfully.";

            })
            .catch(error => {

                message.textContent =
                    error.message ||
                    "Unable to verify your email.";

            });
    }
</script>

</body>
</html>
